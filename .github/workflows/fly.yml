name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an active release before starting the next push's deployment.
concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://macofu.fly.dev
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Verify factory assets and motion
        run: node scripts/verify-factory.mjs

      - name: Build the application
        run: dotnet build --configuration Release

      - name: Verify lessons and independent learner sessions
        shell: bash
        run: |
          dotnet run --configuration Release --no-build --no-launch-profile --urls http://127.0.0.1:5080 > /tmp/macofu-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5080/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5080/healthz > /dev/null || { cat /tmp/macofu-test.log; exit 1; }
          node scripts/smoke-test.mjs
          node scripts/session-test.mjs
          MACOFU_TEST_DLL=bin/Release/net10.0/Macofu.dll node scripts/session-lifecycle-test.mjs

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: '0.5.1'

      - name: Deploy the verified commit
        run: flyctl deploy --app macofu --remote-only --ha=false --yes --image-label "git-${GITHUB_SHA}" --label "org.opencontainers.image.revision=${GITHUB_SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Confirm the live app matches this commit
        run: node scripts/verify-deployment.mjs
        env:
          MACOFU_DEPLOY_URL: https://macofu.fly.dev
